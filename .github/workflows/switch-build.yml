name: Switch ARM64 build
on:
  push:
    branches: [refactor/v0.6-core]
  workflow_dispatch:

concurrency:
  group: switch-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install -y rsync
      - name: Run host tests
        run: bash scripts/test.sh
      - name: Build sysmodule, launcher and user interfaces
        run: bash scripts/build.sh
      - name: Verify package integrity
        run: bash scripts/package.sh && python3 -m zipfile -t dist/switch-ambilight-v0.6.0-switch.zip
      - name: Upload Switch SD package
        uses: actions/upload-artifact@v4
        with:
          name: switch-ambilight-v0.6.0-${{ github.sha }}
          path: dist/switch-ambilight-v0.6.0-switch.zip
          if-no-files-found: error
